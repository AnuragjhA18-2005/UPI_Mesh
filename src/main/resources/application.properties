spring.application.name=UPImesh
spring.datasource.url=jdbc:postgresql://localhost:5432/UPImesh
spring.datasource.username=postgres
spring.datasource.password=Anuragjha1234
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
jwt.secret=${JWT_SECRET:my-very-long-and-secure-secret-key-that-is-at-least-32-characters}

# Bridge Node Authentication
app.auth.username=${APP_AUTH_USERNAME:bridge-node-1}
app.auth.password=${APP_AUTH_PASSWORD:secret123}

# Wait for active database transactions and API requests to finish before shutting down if Spring boot server is stopped between a database transaction the databse could be corruoted so this prevents that
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
